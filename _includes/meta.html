    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1117" />

    {% assign meta_title = page.title | default: site.name %}
    {% assign meta_desc  = page.excerpt | default: site.description | strip_html | truncatewords: 30 %}

    <meta name="description" content="{{ meta_desc }}" />
    <meta name="author" content="{{ site.name }}" />

    <!-- Open Graph -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:title" content="{{ meta_title }}" />
    <meta property="og:description" content="{{ meta_desc }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    {% if site.avatar %}
    <meta property="og:image" content="{{ site.avatar }}" />
    {% endif %}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ meta_title }}" />
    <meta name="twitter:description" content="{{ meta_desc }}" />
    {% if site.avatar %}
    <meta name="twitter:image" content="{{ site.avatar }}" />
    {% endif %}

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />

    <!-- RSS -->
    <link rel="alternate" type="application/rss+xml"
          title="{{ site.name }}" href="{{ '/feed.xml' | relative_url }}" />
